<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donnez votre avis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f3;--surface:#fff;--ink:#111;--muted:#666;--line:#dcdcdc;--accent:#111;--accent-ink:#fff;--star:#111;--star-off:#c6c6c6;--blobA:rgba(0,0,0,.13);--blobB:rgba(255,255,255,.95);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--surface:#151515;--ink:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--accent:#f2f2f2;--accent-ink:#0b0b0b;--star:#f2f2f2;--star-off:#444;--blobA:rgba(255,255,255,.10);--blobB:rgba(0,0,0,.8)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:2.2rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
.sub{color:var(--muted);margin:.5rem 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem;margin-top:1.5rem}
.stars{display:flex;gap:.25rem;margin:.75rem 0 .25rem}
.stars button{flex:1;border:0;background:none;padding:.25rem 0;font-size:2.6rem;line-height:1;color:var(--star-off);cursor:pointer;border-radius:10px}
.stars button.on{color:var(--star)}
.hint{min-height:1.4em;color:var(--muted);font-size:.9rem;margin:0}
label{display:block;font-weight:500;margin-top:1rem}
textarea,input{width:100%;margin-top:.35rem;padding:.75rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
textarea{min-height:7rem;resize:vertical}
:is(button,textarea,input):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.send{width:100%;margin-top:1.25rem;padding:.9rem;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 1.05rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.err{color:#c2410c;font-size:.9rem;min-height:1.3em;margin:.5rem 0 0}
.summary{display:flex;align-items:baseline;gap:.6rem;margin-top:2rem}
.avg{font:700 2.4rem "Bricolage Grotesque",system-ui,sans-serif}
.count{color:var(--muted)}
.bars{margin:.75rem 0 0;display:grid;gap:.3rem;font-size:.85rem;color:var(--muted)}
.bar{display:grid;grid-template-columns:1.2rem 1fr 1.5rem;gap:.5rem;align-items:center}
.bar i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--star)}
.review{border-top:1px solid var(--line);padding:1rem 0}
.review:first-child{border-top:0}
.rhead{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.85rem}
.rstars{color:var(--star);letter-spacing:.1em}
.review p{margin:.35rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted)}
.thanks{display:none;text-align:center;padding:1rem 0}
.gate{text-align:center;padding-top:20vh}
.gate .ring{width:84px;height:84px;margin:0 auto 1.5rem;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:2rem}
.hidden{display:none!important}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.b1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:var(--blobA);animation:d1 34s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;right:-20vmax;top:15vh;background:var(--blobB);animation:d2 42s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:10vw;bottom:-25vmax;background:var(--blobA);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(.9)}}
@keyframes d3{to{transform:translate(14vmax,-14vmax) scale(1.2)}}
.ripple{position:fixed;pointer-events:none;z-index:5;width:20px;height:20px;margin:-10px 0 0 -10px;border:1.5px solid var(--ink);border-radius:50%;opacity:.7;animation:rip .9s ease-out forwards}
@keyframes rip{to{transform:scale(var(--s,5));opacity:0}}
.stars button{transition:transform .15s}
.stars button.on{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.ripple{display:none}.stars button.on{animation:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main>
  <!-- Écran affiché si la page est ouverte sans passer par la carte NFC -->
  <section id="gate" class="gate hidden">
    <div class="ring" aria-hidden="true">📲</div>
    <h1>Approchez votre téléphone de la carte NFC</h1>
    <p class="sub">Cette page d’avis s’ouvre uniquement en scannant la carte posée sur place.</p>
  </section>

  <section id="app" class="hidden">
    <h1 id="name"></h1>
    <p class="sub">Votre avis aide les autres clients. Cela prend 30 secondes.</p>

    <form id="form" class="panel" novalidate>
      <h2>Votre note</h2>
      <div class="stars" id="stars" role="radiogroup" aria-label="Note sur 5"></div>
      <p class="hint" id="hint" aria-live="polite"></p>

      <label for="comment">Votre commentaire</label>
      <textarea id="comment" maxlength="600" placeholder="Ce que vous avez aimé, ce qui pourrait être mieux…"></textarea>

      <label for="author">Votre prénom (facultatif)</label>
      <input id="author" maxlength="30" autocomplete="given-name">

      <p class="err" id="err" role="alert"></p>
      <button class="send" id="send" type="submit" disabled>Publier mon avis</button>
      <div class="thanks" id="thanks"><h2>Merci pour votre avis !</h2><p class="sub">Il est maintenant visible ci-dessous.</p></div>
    </form>

    <div class="summary"><span class="avg" id="avg">–</span><span class="count" id="count"></span></div>
    <div class="bars" id="bars"></div>
    <div class="panel" id="list"></div>
  </section>
</main>

<script>
/* STOCKAGE : les avis sont enregistrés dans Supabase et visibles par tous. */
const SUPABASE_URL = 'https://nkhxyzrvyhsmicbxrdgr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XVJdnraDntLIytI3K09Hsg_wHDVexBf'; // clé publique, faite pour être visible
const Store = {
  headers(){ return { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' }; },
  async list(place){
    try {
      const url = SUPABASE_URL + '/rest/v1/reviews?select=rating,comment,author,created_at'
        + '&place=eq.' + encodeURIComponent(place) + '&order=created_at.desc&limit=200';
      const res = await fetch(url, { headers: this.headers() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      return rows.map(r => ({ rating: r.rating, comment: r.comment || '', author: r.author || 'Anonyme', date: r.created_at }));
    } catch(e){ return null; }
  },
  async add(place, review){
    const res = await fetch(SUPABASE_URL + '/rest/v1/reviews', {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'return=minimal' }, this.headers()),
      body: JSON.stringify({ place, rating: review.rating, comment: review.comment, author: review.author })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  },
  alreadyReviewed(place){
    try { return Date.now() - Number(localStorage.getItem('last:'+place) || 0) < 864e5; } catch(e){ return false; }
  },
  markReviewed(place){ try { localStorage.setItem('last:'+place, String(Date.now())); } catch(e){} }
};

/* Le lien écrit sur la carte NFC : https://votre-site.fr/?r=Chez-Marco */
const params = new URLSearchParams(location.search);
const place = (params.get('r') || '').trim().slice(0,60);
const $ = id => document.getElementById(id);

const LABELS = ['', 'Décevant', 'Moyen', 'Bien', 'Très bien', 'Excellent'];
let rating = 0;

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el, rings, scale){
  if (REDUCED) return;
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < rings; i++){
    const d = document.createElement('span');
    d.className = 'ripple';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.setProperty('--s', scale + i * 2);
    d.style.animationDelay = (i * 140) + 'ms';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1300);
  }
}

if (!place) { $('gate').classList.remove('hidden'); }
else { start(); }


function start(){
  $('app').classList.remove('hidden');
  $('name').textContent = place.replace(/[-_]+/g,' ');
  document.title = 'Avis · ' + $('name').textContent;

  const box = $('stars');
  for (let i = 1; i <= 5; i++){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = '★';
    b.setAttribute('role','radio'); b.setAttribute('aria-checked','false');
    b.setAttribute('aria-label', i + ' sur 5 : ' + LABELS[i]);
    b.addEventListener('click', () => setRating(i));
    box.appendChild(b);
  }
  $('form').addEventListener('submit', submit);
  if (Store.alreadyReviewed(place)) lockForm();
  render();
}

function setRating(n){
  rating = n;
  [...$('stars').children].forEach((b,i) => {
    b.classList.toggle('on', i < n);
    b.setAttribute('aria-checked', String(i + 1 === n));
  });
  $('hint').textContent = LABELS[n];
  $('send').disabled = false;
  burst($('stars').children[n - 1], 1, 5);
}

function lockForm(){
  [...$('form').elements].forEach(el => el.disabled = true);
  $('thanks').style.display = 'block';
  $('thanks').querySelector('p').textContent = 'Vous avez déjà donné votre avis aujourd’hui. Merci !';
}

async function submit(e){
  e.preventDefault();
  if (!rating){ $('err').textContent = 'Choisissez une note de 1 à 5 étoiles.'; return; }
  const review = {
    rating,
    comment: $('comment').value.trim().slice(0,600),
    author: $('author').value.trim().slice(0,30) || 'Anonyme',
    date: new Date().toISOString()
  };
  $('send').disabled = true;
  try { await Store.add(place, review); }
  catch(err){ $('err').textContent = 'L’avis n’a pas pu être envoyé. Vérifiez votre connexion et réessayez.'; $('send').disabled = false; return; }
  Store.markReviewed(place);
  burst($('send'), 3, 14);
  $('err').textContent = '';
  $('send').style.display = 'none';
  $('thanks').style.display = 'block';
  [...$('form').elements].forEach(el => el.disabled = true);
  render();
}

async function render(){
  let reviews = await Store.list(place);
  if (reviews === null){ $('list').textContent = 'Impossible de charger les avis pour le moment.'; return; }
  const n = reviews.length;
  const avg = n ? reviews.reduce((s,r) => s + r.rating, 0) / n : 0;
  $('avg').textContent = n ? avg.toFixed(1).replace('.',',') + ' / 5' : '–';
  $('count').textContent = n ? n + (n > 1 ? ' avis' : ' avis') : '';

  const bars = $('bars'); bars.textContent = '';
  if (n) for (let s = 5; s >= 1; s--){
    const c = reviews.filter(r => r.rating === s).length;
    const row = document.createElement('div'); row.className = 'bar';
    row.innerHTML = '<span></span><i><b></b></i><span></span>';
    row.children[0].textContent = s;
    row.querySelector('b').style.width = (c / n * 100) + '%';
    row.children[2].textContent = c;
    bars.appendChild(row);
  }

  const list = $('list'); list.textContent = '';
  if (!n){
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = 'Aucun avis pour l’instant. Soyez le premier à donner le vôtre !';
    list.appendChild(p); return;
  }
  reviews.forEach(r => {
    const d = document.createElement('div'); d.className = 'review';
    const h = document.createElement('div'); h.className = 'rhead';
    const left = document.createElement('span');
    const st = document.createElement('span'); st.className = 'rstars';
    st.textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    st.setAttribute('aria-label', r.rating + ' sur 5');
    left.appendChild(st);
    const right = document.createElement('span');
    right.textContent = r.author + ' · ' + new Date(r.date).toLocaleDateString('fr-FR');
    h.append(left, right); d.appendChild(h);
    if (r.comment){ const p = document.createElement('p'); p.textContent = r.comment; d.appendChild(p); }
    list.appendChild(d);
  });
}
</script>
</body>
</html>
